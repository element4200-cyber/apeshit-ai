name: Import app source
on:
  push:
    branches: [main]
    paths:
      - apeshit-ai-source.tar.gz
      - .github/workflows/import-source.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract the checked-in app source
        run: tar -xzf apeshit-ai-source.tar.gz
      - name: Commit the app files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import complete APESHIT AI app source"
            git push
          fi
